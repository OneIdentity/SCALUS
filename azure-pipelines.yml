# =============================================================================
# SCALUS CI/CD - trunk-based development with tag-driven releases.
#
#   * Every push to master and every PR to master runs Build & Test.
#   * Pushes to master AND PRs additionally build (unsigned) installers for all
#     six OS/arch legs, so packaging breaks surface immediately - on the PR that
#     introduces them, before merge.
#   * A release is cut by tagging a commit `vX.Y.Z` (the tag MUST match
#     <VersionPrefix> in Directory.Build.props - scripts/version.* enforces it).
#     A tag build signs/notarizes the installers and drafts a GitHub release.
#
# The version is NEVER hardcoded here - scripts/version.ps1 / version.sh derive
# it from the git ref + Directory.Build.props and publish it as $(Version):
#   trunk/PR build  -> 2.0.0.<buildCounter> (incrementing, prerelease, installer-safe)
#   tag build vX.Y.Z -> X.Y.Z            (clean release semver)
# =============================================================================

trigger:
  branches:
    include:
    - master
  tags:
    include:
    - v*

pr:
  branches:
    include:
    - master

name: $(Date:yyyyMMdd).$(Rev:r)

variables:
  buildConfiguration: 'Release'
  dotnetSdkVersion: '10.0.x'
  wixVersion: '5.0.2'
  signToolPath: 'C:\Program Files (x86)\Microsoft SDKs\ClickOnce\SignTool\signtool.exe'
  # Compile-time gates. Packaging runs everywhere (PRs included) so build
  # breaks surface pre-merge; signing/notarizing and the GitHub release happen
  # only on a `v*` tag.
  isTagBuild: $[ startsWith(variables['Build.SourceBranch'], 'refs/tags/') ]
  isPr: $[ eq(variables['Build.Reason'], 'PullRequest') ]
  buildCounter: "$[counter('scalus',1)]"
jobs:
# ---------------------------------------------------------------------------
# Build & unit tests. Runs for PRs, trunk and tags. The version step here also
# fails the whole pipeline early if a release tag drifts from Directory.Build.props.
# ---------------------------------------------------------------------------
- job: BuildAndTest
  displayName: 'Build & Test'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - script: bash $(Build.SourcesDirectory)/scripts/version.sh --build-counter $(buildCounter)
    displayName: 'Derive version (drift guard)'

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '$(dotnetSdkVersion)'
      includePreviewVersions: false

  - script: dotnet test test/OneIdentity.Scalus.Test.csproj --configuration $(buildConfiguration)
    displayName: 'dotnet test'

# ---------------------------------------------------------------------------
# Windows: NativeAOT scalus.exe + Photino scalus-ui + WiX 5 MSI (x64 & arm64).
# Builds on PRs too (unsigned); signed only on tag builds.
# ---------------------------------------------------------------------------
- job: Windows
  dependsOn: BuildAndTest
  condition: succeeded()
  pool:
    vmImage: 'windows-latest'
  strategy:
    matrix:
      x64:
        rid: 'win-x64'
      arm64:
        rid: 'win-arm64'
  steps:
  - powershell: |
      & $(Build.SourcesDirectory)\scripts\version.ps1 -BuildCounter '$(buildCounter)'
    displayName: 'Derive version'

  - task: AzureKeyVault@2
    displayName: 'Get code signing certificate from Azure Key Vault'
    inputs:
      # The "Safeguard Privileged Passwords" project in Azure has been setup with a new Connected Service under Project Settings > Service Connections.
      # We may not have permissions to view them, but they are there. And this service connection should then have access to
      # the SPPCodeSigning Key Vault under the OneIdentity.Ops.SaaS.AzureDevOpsInfrastructure subscription, in the CodeSigningCertificates
      # resource group.
      ConnectedServiceName: "OneIdentity.Infrastructure.SPPCodeSigning"
      KeyVaultName: "SPPCodeSigning"
      SecretsFilter: "SPPCodeSigning-Password, SPPCodeSigning-TotpPrivateKey"
    # PRs from repository forks are not allowed to access secrets in the pipeline. For more information see https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/github?view=azure-devops&tabs=yaml#access-restrictions
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  # SSL.com example:
  # https://www.ssl.com/how-to/how-to-integrate-esigner-cka-with-ci-cd-tools-for-automated-code-signing/#ftoc-heading-1
  # and click on the Azure Pipeline tab.
  - powershell: |
      # Download and unzip eSignerCKA setup. This downloads their latest version, which when unzipped has
      # a file name that also contains the version number. So we need to move it to a known name.
      Invoke-WebRequest -OutFile eSigner_CKA_Setup.zip "https://www.ssl.com/download/ssl-com-esigner-cka"
      Expand-Archive -Force eSigner_CKA_Setup.zip
      Remove-Item eSigner_CKA_Setup.zip
      Move-Item -Path "eSigner_CKA_*\*.exe" -Destination "eSigner_CKA_Installer.exe"
    displayName: "Download and Unzip eSignerCKA Setup"
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  - powershell: |
      .\eSigner_CKA_Installer.exe /CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /DIR="$(Build.SourcesDirectory)\eSignerCKA" | Out-Null
      dir $(Build.SourcesDirectory)\eSignerCKA
    displayName: "Setup eSignerCKA in silent mode and output installation directory"
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  - powershell: |
      $(Build.SourcesDirectory)\eSignerCKA\eSignerCKATool.exe config -mode "product" -user "ssl.oid.safeguardpp@groups.quest.com" -pass "$(SPPCodeSigning-Password)" -totp "$(SPPCodeSigning-TotpPrivateKey)" -key "$(Build.SourcesDirectory)\eSignerCKA\master.key" -r
    displayName: "Configure account information on eSignerCKA using Azure Key Vault values"
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  - powershell: |
      $(Build.SourcesDirectory)\eSignerCKA\eSignerCKATool.exe unload
      $(Build.SourcesDirectory)\eSignerCKA\eSignerCKATool.exe load
    displayName: "Unload and load certificate into Windows Certificate Store"
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  # We should now be able to access the certificate using the standard Windows signtool.exe from the Windows SDK,
  # which should be installed on the build agent images being used. signtool.exe accesses the certificate by a
  # partial subject name match ("One Identity LLC") inside scripts\Win\package.ps1.

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '$(dotnetSdkVersion)'

  # WiX 5 runs as a .NET tool; ship the older runtime it targets so the tool can start.
  - task: UseDotNet@2
    displayName: 'Install .NET 8 runtime (for the wix tool)'
    inputs:
      packageType: 'runtime'
      version: '8.0.x'

  - powershell: |
      dotnet tool install --global wix --version $(wixVersion)
      wix extension add -g WixToolset.UI.wixext/$(wixVersion)
    displayName: 'Install WiX $(wixVersion) + UI extension'

  - task: NodeTool@0
    displayName: 'Install Node.js (Angular UI build)'
    inputs:
      versionSpec: '22.x'

  - powershell: |
      & $(Build.SourcesDirectory)\scripts\publish.ps1 -Runtime $(rid) -Configuration $(buildConfiguration) -Version $(Version)
    displayName: 'Publish scalus + scalus-ui ($(rid))'

  - powershell: |
      $pkgArgs = @{
        Runtime       = '$(rid)'
        Configuration = '$(buildConfiguration)'
        Version       = '$(Version)'
        SignToolPath  = '$(signToolPath)'
      }
      if ('$(isTagBuild)' -eq 'True') { $pkgArgs.SignFiles = $true }
      & $(Build.SourcesDirectory)\scripts\Win\package.ps1 @pkgArgs
    displayName: 'Build MSI ($(rid))'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.SourcesDirectory)/Output/$(buildConfiguration)/$(rid)'
      artifact: 'Scalus-$(rid)'
      publishLocation: 'pipeline'

# ---------------------------------------------------------------------------
# Linux: NativeAOT scalus + Photino scalus-ui + tar.gz/.deb/.rpm (x64 & arm64).
# Builds on PRs too (Linux artifacts are unsigned).
# ---------------------------------------------------------------------------
- job: Linux
  dependsOn: BuildAndTest
  condition: succeeded()
  pool:
    vmImage: 'ubuntu-latest'
  strategy:
    matrix:
      x64:
        rid: 'linux-x64'
      arm64:
        rid: 'linux-arm64'
  steps:
  - script: bash $(Build.SourcesDirectory)/scripts/version.sh --build-counter $(buildCounter)
    displayName: 'Derive version'

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '$(dotnetSdkVersion)'

  # NativeAOT needs clang + zlib headers; the arm64 leg cross-compiles so it also
  # needs the aarch64 binutils/gcc. (arm64 legs are CI-gated per the migration plan.)
  - script: |
      sudo apt-get update
      sudo apt-get install -y clang zlib1g-dev
    displayName: 'Install AOT toolchain (base)'

  - task: NodeTool@0
    displayName: 'Install Node.js (Angular UI build)'
    inputs:
      versionSpec: '22.x'

  - script: |
      sudo apt-get install -y binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
    displayName: 'Install aarch64 cross toolchain'
    condition: eq(variables['rid'], 'linux-arm64')

  # fpm (Ruby gem) builds the .deb/.rpm; the rpm package provides rpmbuild for
  # the .rpm target. Without these, package.sh still emits the tarball but warns
  # and skips the native packages.
  - script: |
      sudo apt-get install -y ruby ruby-dev build-essential rpm
      sudo gem install --no-document fpm
    displayName: 'Install fpm + rpm (deb/rpm packaging)'

  - script: |
      bash $(Build.SourcesDirectory)/scripts/publish.sh --runtime $(rid) --configuration $(buildConfiguration) --version $(Version)
    displayName: 'Publish scalus + scalus-ui ($(rid))'

  - script: |
      bash $(Build.SourcesDirectory)/scripts/Linux/package.sh --runtime $(rid) --configuration $(buildConfiguration) --version $(Version)
    displayName: 'Package tar.gz + .deb + .rpm ($(rid))'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.SourcesDirectory)/Output/$(buildConfiguration)/$(rid)'
      artifact: 'Scalus-$(rid)'
      publishLocation: 'pipeline'

# ---------------------------------------------------------------------------
# macOS: NativeAOT scalus + Photino scalus-ui, .app/.pkg, sign + notarize
# (x64 & arm64). macOS runners are arm64; the x64 leg cross-targets via the
# universal Apple toolchain. Builds on PRs too; signed/notarized only on tags.
# ---------------------------------------------------------------------------
- job: Mac
  dependsOn: BuildAndTest
  condition: succeeded()
  pool:
    vmImage: 'macOS-latest'
  strategy:
    matrix:
      x64:
        rid: 'osx-x64'
      arm64:
        rid: 'osx-arm64'
  steps:
  - script: bash $(Build.SourcesDirectory)/scripts/version.sh --build-counter $(buildCounter)
    displayName: 'Derive version'

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '$(dotnetSdkVersion)'

  - task: AzureKeyVault@2
    inputs:
      ConnectedServiceName: "OneIdentity.Infrastructure.SPPCodeSigning"
      KeyVaultName: "SPPCodeSigning"
      SecretsFilter: 'AppleCertificate-Installer-Cert,AppleCertificate-Installer-Password,AppleCertificate-Application-Cert,Apple-App-Specific-Password'
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  - powershell: |
         $kvSecretBytes = [System.Convert]::FromBase64String("$(AppleCertificate-Installer-Cert)")
         $certCollection = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2Collection
         $certCollection.Import($kvSecretBytes,$null,[System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
         $protectedCertificateBytes = $certCollection.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pkcs12,"$(AppleCertificate-Installer-Password)")
         $certpath = '$(Build.SourcesDirectory)/$(ProductSigningCertFileName)'
         Write-Verbose -Verbose $certpath
         [System.IO.File]::WriteAllBytes($certpath, $protectedCertificateBytes)
         sudo security import $certpath -k /Library/Keychains/System.keychain -P $(AppleCertificate-Installer-Password) -A -t cert -f pkcs12
    displayName: 'Save Apple product signing certificate to PFX file'
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  - powershell: |
        $kvSecretBytes = [System.Convert]::FromBase64String("$(AppleCertificate-Application-Cert)")
        $certCollection = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2Collection
        $certCollection.Import($kvSecretBytes,$null,[System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
        $protectedCertificateBytes = $certCollection.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pkcs12,"$(AppleCertificate-Installer-Password)")
        $certpath = '$(Build.SourcesDirectory)/$(CodeSigningCertFileName)'
        Write-Verbose -Verbose $certpath
        [System.IO.File]::WriteAllBytes($certpath, $protectedCertificateBytes)
        sudo security import $certpath -k /Library/Keychains/System.keychain -P $(AppleCertificate-Installer-Password) -A -t cert -f pkcs12
    displayName: 'Save Apple code signing certificate to PFX file'
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  - task: DeleteFiles@1
    displayName: 'Delete product signing certificate files'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: '$(ProductSigningCertFileName)'
    condition: and(succeededOrFailed(), eq(variables.isTagBuild, true))

  - task: DeleteFiles@1
    displayName: 'Delete code signing certificate files'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: '$(CodeSigningCertFileName)'
    condition: and(succeededOrFailed(), eq(variables.isTagBuild, true))

  - task: NodeTool@0
    displayName: 'Install Node.js (Angular UI build)'
    inputs:
      versionSpec: '22.x'

  - script: |
      bash $(Build.SourcesDirectory)/scripts/publish.sh --runtime $(rid) --configuration $(buildConfiguration) --version $(Version)
    displayName: 'Publish scalus + scalus-ui ($(rid))'

  - task: Bash@3
    displayName: 'Package .pkg + .tar.gz ($(rid))'
    inputs:
      filePath: '$(Build.SourcesDirectory)/scripts/Osx/package.sh'
      arguments: '--version $(Version) --runtime $(rid) --infile $(Build.SourcesDirectory)/scripts/Osx/applet --outpath $(Build.SourcesDirectory)/Output/$(buildConfiguration)/$(rid) --publishdir $(Build.SourcesDirectory)/Publish/$(buildConfiguration)/$(rid) --isrelease $(isTagBuild)'

  - powershell: |
      sudo productsign --sign 'LDBTVAT43D' $(Build.SourcesDirectory)/Output/$(buildConfiguration)/$(rid)/scalus-$(Version)-$(rid).pkg $(Build.SourcesDirectory)/Output/$(buildConfiguration)/$(rid)/scalus-$(Version)-$(rid)_Signed.pkg
    displayName: 'ProductSigning for pkg'
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  - script: |
        # Upload the pkg to the Apple Notary Service
        xcrun notarytool submit \
            --apple-id "One.Identity.Apple.Developer@oneidentity.com" \
            --password "$(Apple-App-Specific-Password)" \
            --team-id "LDBTVAT43D" \
            --wait \
            $(Build.SourcesDirectory)/Output/$(buildConfiguration)/$(rid)/scalus-$(Version)-$(rid)_Signed.pkg
    displayName: 'Upload and notarize for pkg'
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  - powershell: |
      sudo xcrun stapler staple $(Build.SourcesDirectory)/Output/$(buildConfiguration)/$(rid)/scalus-$(Version)-$(rid)_Signed.pkg
    displayName: 'Staple for pkg'
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  - powershell: |
      Move-Item -Path "$(Build.SourcesDirectory)/Output/$(buildConfiguration)/$(rid)/scalus-$(Version)-$(rid)_Signed.pkg" -Destination "$(Build.SourcesDirectory)/Output/$(buildConfiguration)/$(rid)/scalus-$(Version)-$(rid).pkg" -Force
    displayName: 'Replace signed pkg'
    condition: and(succeeded(), eq(variables.isTagBuild, true))

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.SourcesDirectory)/Output/$(buildConfiguration)/$(rid)'
      artifact: 'Scalus-$(rid)'
      publishLocation: 'pipeline'

# ---------------------------------------------------------------------------
# Release: on a `v*` tag, gather every OS/arch artifact and draft a GitHub
# release. Created as a DRAFT so a human can review the notes/assets and click
# publish. Runs only for tag builds.
# ---------------------------------------------------------------------------
- job: Release
  dependsOn:
  - Windows
  - Linux
  - Mac
  condition: and(succeeded(), eq(variables.isTagBuild, true))
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - download: current
    displayName: 'Download all build artifacts'

  - task: GitHubRelease@1
    displayName: 'Draft GitHub release from tag'
    inputs:
      # Shared OneIdentity build service connection used by the Safeguard SDK
      # pipelines (safeguard-ps, SafeguardDotNet, PySafeguard, ...).
      gitHubConnection: 'PangaeaBuild-GitHub'
      repositoryName: 'OneIdentity/SCALUS'
      action: 'create'
      target: '$(Build.SourceVersion)'
      tagSource: 'gitTag'
      title: 'SCALUS $(Build.SourceBranchName)'
      isDraft: true
      isPreRelease: false
      addChangeLog: true
      changeLogCompareToRelease: 'lastFullRelease'
      # Attach only the shippable installers/archives, not the whole publish tree.
      assets: |
        $(Pipeline.Workspace)/**/*.msi
        $(Pipeline.Workspace)/**/*.pkg
        $(Pipeline.Workspace)/**/*.deb
        $(Pipeline.Workspace)/**/*.rpm
        $(Pipeline.Workspace)/**/*.tar.gz
